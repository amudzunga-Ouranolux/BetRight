name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  ml-tests:
    name: ML service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml-prediction
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: pytest
        env:
          DATABASE_URL: sqlite+pysqlite:///./ci.db
        run: pytest -q

  bff-tests:
    name: BFF (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test BetRight.Bff.Tests/BetRight.Bff.Tests.csproj -c Release

  app-check:
    name: Mobile app (typecheck + lint + emoji)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: betright-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --legacy-peer-deps
      - run: npm run check
