[project]
name = "betright-ml-prediction"
version = "1.0.0"
description = "BetRight prediction + ML service (formula engine: Dixon-Coles + Elo + form)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Reserved for Phase 7 (ML ensemble). Not needed for the formula engine.
ml = ["numpy>=1.26", "lightgbm>=4.3", "scikit-learn>=1.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
