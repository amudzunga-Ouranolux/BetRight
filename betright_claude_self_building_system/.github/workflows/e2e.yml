name: E2E Smoke

on:
  pull_request:
    paths:
      - 'src/**'
      - 'app/**'
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps || true
      - run: npm run e2e --if-present
